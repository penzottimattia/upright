include:
  -
    key: simulation
    package: upright_cmd
    path: config/simulation.yaml
  -
    key: controller
    package: upright_cmd
    path: config/controller.yaml
  -
    package: upright_cmd
    path: config/robots/panda.yaml

logging:
  timestep: 1.0
  log_dir: /root/.logs

simulation:
  duration: 10.0
  arrangement: nothing

  static_obstacles:
    enabled: false
    urdf:
      package: "upright_assets"
      path: "thing/urdf/obstacles.urdf"
      includes:
        - "$(find upright_assets)/thing/xacro/obstacles/spheres.urdf.xacro"

  dynamic_obstacles:
    enabled: true
    obstacles:
      -
        # True if the object's trajectory should be tracked, false if it should
        # just be allowed to evolve subject to gravity
        # Note that acceleration is still required either way
        autostart: false
        controlled: true
        collides: false
        radius: 0.1
        relative: false
        modes:
          - time: 0
            position: [0.5, 0.5, 0.5]
            velocity: [0, -0.1, 0]
            acceleration: [0, 0, 0]

controller:

  waypoints:
    -
      time: 0
      position: [0.0, 1.0, 0.0]
      orientation: [0, 0, 0, 1]

  tracking:
    use_projectile: false

  obstacles:
    enabled: true

    dynamic:
      -
        name: dynamic_1
        radius: 0.1
        modes:
          - time: 0
            position: [0.5, 0.5, 0.5]
            velocity: [0, -0.1, 0]
            acceleration: [0, 0, 0]

    # extra margin between objects
    # Important: this needs to be > 0 for the resulting constraint to be
    # differentiable
    minimum_distance: 0.02
    
    collision_pairs:
      - ["panda_link4_0", "dynamic_1"]
      - ["panda_link6_0", "dynamic_1"]
      - ["panda_link7_0", "dynamic_1"]
      # - ["panda_link4_0", "sphere_1_0"]
      # - ["panda_link6_0", "sphere_1_0"]
